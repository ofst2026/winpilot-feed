
name: Gewinnspiele aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6,18 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gewinnspiele suchen
        run: python fetch_feed.py
      - name: Ergebnis speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || (git commit -m "Gewinnspiele aktualisieren" && git push)
